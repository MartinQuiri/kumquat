version = 1
SPDX-PackageName = "Kumquat"
SPDX-PackageDownloadLocation = "https://github.com/"

# Los .cs llevan cabecera SPDX (impuesta por IDE0073). El resto de archivos del repo
# (configuración, docs, manifiestos) se declara aquí.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Kumquat contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["assets/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/Phosphor-LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2023 Phosphor Icons"
SPDX-License-Identifier = "MIT"
